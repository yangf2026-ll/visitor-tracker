<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>访客记录后台</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #f5f7fa;
      color: #333;
      min-height: 100vh;
    }
    /* 登录页 */
    .login-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .login-box {
      background: #fff;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      width: 360px;
    }
    .login-box h2 {
      text-align: center;
      margin-bottom: 24px;
      color: #333;
    }
    .login-box input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 16px;
      outline: none;
    }
    .login-box input:focus {
      border-color: #667eea;
    }
    .login-box button {
      width: 100%;
      padding: 12px;
      background: #667eea;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
    }
    .login-box button:hover {
      background: #5568d3;
    }
    .error-msg {
      color: #e74c3c;
      font-size: 13px;
      text-align: center;
      margin-bottom: 12px;
      display: none;
    }
    /* 后台主界面 */
    .dashboard {
      display: none;
      padding: 20px;
      max-width: 1400px;
      margin: 0 auto;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 12px;
    }
    .header h1 {
      font-size: 22px;
    }
    .actions {
      display: flex;
      gap: 10px;
    }
    .btn {
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
    }
    .btn-primary {
      background: #667eea;
      color: #fff;
    }
    .btn-primary:hover {
      background: #5568d3;
    }
    .btn-danger {
      background: #e74c3c;
      color: #fff;
    }
    .btn-danger:hover {
      background: #c0392b;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      margin-bottom: 20px;
    }
    .stat-card {
      background: #fff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }
    .stat-card .label {
      font-size: 13px;
      color: #999;
      margin-bottom: 8px;
    }
    .stat-card .value {
      font-size: 28px;
      font-weight: 600;
      color: #333;
    }
    .table-wrap {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    th, td {
      padding: 12px 14px;
      text-align: left;
      border-bottom: 1px solid #eee;
      vertical-align: top;
    }
    th {
      background: #f8f9fb;
      font-weight: 600;
      color: #555;
      white-space: nowrap;
    }
    tr:hover {
      background: #f8f9fb;
    }
    .ip {
      font-family: monospace;
      color: #667eea;
    }
    .time {
      color: #666;
      white-space: nowrap;
    }
    .ua {
      max-width: 200px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: #888;
    }
    .location {
      font-size: 12px;
      line-height: 1.5;
    }
    .location .coords {
      font-family: monospace;
      color: #333;
    }
    .location .accuracy {
      color: #999;
      font-size: 11px;
    }
    .location a {
      color: #667eea;
      text-decoration: none;
      font-size: 12px;
    }
    .location a:hover {
      text-decoration: underline;
    }
    .no-location {
      color: #ccc;
      font-size: 12px;
    }
    .empty {
      text-align: center;
      padding: 60px 20px;
      color: #999;
    }
    .loading {
      text-align: center;
      padding: 40px;
      color: #999;
    }
    @media (max-width: 768px) {
      .ua { display: none; }
      th, td { padding: 8px 10px; font-size: 12px; }
      .location { max-width: 150px; }
    }
  </style>
</head>
<body>
  <!-- 登录页 -->
  <div class="login-wrap" id="loginPage">
    <div class="login-box">
      <h2>访客记录后台</h2>
      <div class="error-msg" id="errorMsg">密码错误，请重试</div>
      <input type="password" id="passwordInput" placeholder="请输入后台密码" />
      <button onclick="login()">登 录</button>
    </div>
  </div>

  <!-- 后台主界面 -->
  <div class="dashboard" id="dashboard">
    <div class="header">
      <h1>📊 访客记录（含GPS定位）</h1>
      <div class="actions">
        <button class="btn btn-primary" onclick="loadData()">🔄 刷新</button>
        <button class="btn btn-danger" onclick="clearAll()">🗑️ 清空记录</button>
        <button class="btn" onclick="logout()">退出</button>
      </div>
    </div>

    <div class="stats">
      <div class="stat-card">
        <div class="label">总访问次数</div>
        <div class="value" id="totalCount">0</div>
      </div>
      <div class="stat-card">
        <div class="label">今日访问</div>
        <div class="value" id="todayCount">0</div>
      </div>
      <div class="stat-card">
        <div class="label">独立 IP 数</div>
        <div class="value" id="uniqueIp">0</div>
      </div>
      <div class="stat-card">
        <div class="label">已授权定位</div>
        <div class="value" id="locationCount">0</div>
      </div>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>时间</th>
            <th>IP 地址</th>
            <th>浏览器/设备</th>
            <th>GPS 位置</th>
            <th class="ua">User-Agent</th>
          </tr>
        </thead>
        <tbody id="visitTable">
          <tr><td colspan="5" class="loading">加载中...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    let currentPassword = '';

    // 回车登录
    document.getElementById('passwordInput').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') login();
    });

    function login() {
      const pwd = document.getElementById('passwordInput').value;
      if (!pwd) return;
      currentPassword = pwd;
      fetch('/api/visits?password=' + encodeURIComponent(pwd))
        .then(res => {
          if (res.status === 401) {
            document.getElementById('errorMsg').style.display = 'block';
            currentPassword = '';
            throw new Error('密码错误');
          }
          return res.json();
        })
        .then(data => {
          document.getElementById('loginPage').style.display = 'none';
          document.getElementById('dashboard').style.display = 'block';
          renderData(data);
        })
        .catch(err => console.error(err));
    }

    function logout() {
      currentPassword = '';
      document.getElementById('dashboard').style.display = 'none';
      document.getElementById('loginPage').style.display = 'flex';
      document.getElementById('passwordInput').value = '';
      document.getElementById('errorMsg').style.display = 'none';
    }

    function loadData() {
      if (!currentPassword) return;
      document.getElementById('visitTable').innerHTML = '<tr><td colspan="5" class="loading">加载中...</td></tr>';
      fetch('/api/visits?password=' + encodeURIComponent(currentPassword))
        .then(res => res.json())
        .then(data => renderData(data))
        .catch(err => {
          document.getElementById('visitTable').innerHTML = '<tr><td colspan="5" class="empty">加载失败</td></tr>';
        });
    }

    function renderData(data) {
      const visits = data.visits || [];
      document.getElementById('totalCount').textContent = data.total;

      // 今日访问数
      const today = new Date().toDateString();
      const todayCount = visits.filter(v => new Date(v.time).toDateString() === today).length;
      document.getElementById('todayCount').textContent = todayCount;

      // 独立IP数
      const uniqueIps = new Set(visits.map(v => v.ip));
      document.getElementById('uniqueIp').textContent = uniqueIps.size;

      // 已授权定位数
      const locationCount = visits.filter(v => v.latitude != null && v.longitude != null).length;
      document.getElementById('locationCount').textContent = locationCount;

      // 表格
      const tbody = document.getElementById('visitTable');
      if (visits.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="empty">暂无访问记录</td></tr>';
        return;
      }

      tbody.innerHTML = visits.map(v => {
        let locationHtml = '';
        if (v.latitude != null && v.longitude != null) {
          const acc = v.accuracy ? `（精度约 ${Math.round(v.accuracy)} 米）` : '';
          // OpenStreetMap 地图链接（国内可访问）
          const mapUrl = `https://www.openstreetmap.org/?mlat=${v.latitude}&mlon=${v.longitude}#map=18/${v.latitude}/${v.longitude}`;
          locationHtml = `
            <div class="location">
              <div class="coords">${v.latitude.toFixed(6)}, ${v.longitude.toFixed(6)}</div>
              <div class="accuracy">${acc}</div>
              <a href="${mapUrl}" target="_blank">📍 在地图中查看</a>
            </div>
          `;
        } else {
          locationHtml = '<div class="no-location">未授权定位</div>';
        }

        return `
          <tr>
            <td class="time">${formatTime(v.time)}</td>
            <td class="ip">${v.ip || '-'}</td>
            <td>${parseUA(v.userAgent)}</td>
            <td>${locationHtml}</td>
            <td class="ua" title="${escapeHtml(v.userAgent)}">${escapeHtml(v.userAgent)}</td>
          </tr>
        `;
      }).join('');
    }

    function clearAll() {
      if (!confirm('确定要清空所有访问记录吗？此操作不可恢复！')) return;
      fetch('/api/visits?password=' + encodeURIComponent(currentPassword), {
        method: 'DELETE'
      })
        .then(res => res.json())
        .then(() => loadData())
        .catch(err => alert('清空失败'));
    }

    function formatTime(iso) {
      const d = new Date(iso);
      const pad = n => n.toString().padStart(2, '0');
      return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
    }

    function parseUA(ua) {
      if (!ua) return '-';
      let browser = '未知浏览器';
      let os = '未知系统';
      if (/Edg\//.test(ua)) browser = 'Edge';
      else if (/Chrome\//.test(ua)) browser = 'Chrome';
      else if (/Firefox\//.test(ua)) browser = 'Firefox';
      else if (/Safari\//.test(ua)) browser = 'Safari';
      if (/Windows NT 10/.test(ua)) os = 'Win10/11';
      else if (/Windows NT/.test(ua)) os = 'Windows';
      else if (/Mac OS X/.test(ua)) os = 'macOS';
      else if (/Android/.test(ua)) os = 'Android';
      else if (/iPhone|iPad|iPod/.test(ua)) os = 'iOS';
      else if (/Linux/.test(ua)) os = 'Linux';
      return `${browser} / ${os}`;
    }

    function escapeHtml(str) {
      if (!str) return '';
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    // 自动刷新（每30秒）
    setInterval(() => {
      if (currentPassword) loadData();
    }, 30000);
  </script>
</body>
</html>
